    * { box-sizing: border-box; }
    ::selection { background: var(--selection-bg); color: var(--selection-color); }
    * { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); background-clip: content-box; border: 3px solid transparent; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .47; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus-outline); outline-offset: 2px;
    }
    a { color: var(--brand); }
    .icon { width: 18px; height: 18px; stroke-width: 1.8; flex: none; vertical-align: middle; }
    .icon.small { width: 15px; height: 15px; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 244px minmax(0, 1fr); }
    .sidebar { background: linear-gradient(180deg, var(--nav) 0%, var(--nav-end) 100%); color: var(--nav-foot-strong); min-height: 100vh; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; z-index: 30; box-shadow: var(--sidebar-shadow); }
    .brand { height: 78px; display: flex; gap: 12px; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--nav-border); }
    .brand-mark { width: 38px; height: 38px; border: 1.5px solid var(--brand-mark-border); color: var(--brand-mark-text); display: grid; place-items: center; border-radius: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.08em; background: var(--brand-mark-bg); }
    .brand-title { font-size: 16px; font-weight: 750; letter-spacing: .02em; color: var(--brand-title-color); }
    .brand-sub { color: var(--brand-sub); font-size: 11px; margin-top: 3px; letter-spacing: .06em; }
    .nav-scroll { overflow-y: auto; padding: 15px 11px 20px; flex: 1; }
    .nav-group { margin-bottom: 14px; }
    .nav-label { color: var(--nav-label); font-size: 10px; letter-spacing: .15em; font-weight: 700; padding: 11px 13px 7px; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent; color: var(--nav-item); padding: 10px 13px; border-radius: 8px; text-align: left; font-size: 13px; font-weight: 600; transition: background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease); }
    .nav-item:hover { background: var(--nav-item-hover-bg); color: var(--brand-title-color); transform: translateX(2px); }
    .nav-item.active { background: var(--nav-item-active); color: var(--brand-title-color); box-shadow: inset 3px 0 var(--nav-accent), 0 2px 10px rgba(0, 0, 0, .12); }
    .nav-item .count { margin-left: auto; background: var(--count-bg); color: #fff; border-radius: 20px; padding: 1px 7px; font-size: 10px; box-shadow: var(--count-shadow); }
    .nav-foot { border-top: 1px solid var(--nav-border); padding: 15px 20px 17px; font-size: 11px; color: var(--nav-foot); line-height: 1.7; }
    .nav-foot strong { color: var(--nav-foot-strong); font-weight: 650; }
    .workspace { min-width: 0; }
    .topbar { height: 68px; position: sticky; top: 0; z-index: 20; background: var(--topbar-bg); backdrop-filter: blur(14px) saturate(1.25); -webkit-backdrop-filter: blur(14px) saturate(1.25); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 15px; padding: 0 28px; }
    .menu-button { display: none !important; }
    .top-path { min-width: 0; margin-right: auto; }
    .top-path small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .11em; font-weight: 700; }
    .top-path strong { display: block; font-size: 15px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .top-action { border: 1px solid var(--line); background: var(--top-action-bg); color: var(--ink); padding: 8px 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; transition: background .16s var(--ease), border-color .16s var(--ease), transform .16s var(--ease), box-shadow .16s var(--ease); }
    .top-action:hover { border-color: var(--top-action-hover-border); background: var(--surface-soft); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .proto-strip { background: var(--proto-bg); color: var(--proto-text); border-bottom: 1px solid var(--proto-border); padding: 9px 28px; font-size: 11px; display: flex; align-items: center; gap: 8px; }
    .proto-strip strong { color: var(--proto-strong); }
    .page { width: min(100%, 1540px); margin: 0 auto; padding: 25px 28px 48px; animation: rise .26s var(--ease); }
    @keyframes rise { from { opacity: .6; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 21px; }
    .eyebrow { margin: 0 0 6px; color: var(--brand); font-size: 10px; letter-spacing: .13em; font-weight: 800; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(22px, 2vw, 28px); line-height: 1.3; letter-spacing: -.02em; margin-bottom: 5px; }
    h2 { font-size: 15px; line-height: 1.4; margin-bottom: 0; }
    h3 { font-size: 13px; line-height: 1.4; margin-bottom: 0; }
    .lead { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0; }
    .subtle { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .small { font-size: 11px; }
    .mono, .metric-value, .data-table td.numeric, .clock { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .row.space { justify-content: space-between; }
    .stack { display: grid; gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .grid-main { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(290px, .85fr); gap: 16px; align-items: start; }
    .grid-side { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(330px, .85fr); gap: 16px; align-items: start; }
    .panel { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .25s var(--ease); }
    .panel:hover { box-shadow: var(--shadow), 0 2px 8px rgba(0, 0, 0, .05); }
    .panel-header { padding: 17px 19px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel-header-bg); }
    .panel-header p { margin: 3px 0 0; }
    .panel-body { padding: 18px 19px; }
    .panel-body.compact { padding: 0; }
    .panel-footer { border-top: 1px solid var(--line); padding: 13px 19px; background: var(--panel-footer-bg); }
    .hero-panel { background: var(--hero-bg); color: white; border: 1px solid var(--hero-border); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-columns: minmax(0,1fr) 290px; box-shadow: var(--shadow-lg); position: relative; }
    .hero-main { padding: 22px 24px; position: relative; }
    .hero-main .eyebrow { color: var(--hero-eyebrow); }

    function exportCsv(){const h=selectedHistory();const base=h.snapshot?gasValues({}):gasValues({n2:3,h2:1,co:0.8});const header=['experiment_id','sampled_at','experiment_type','inert','temperature_c','weight_g',...gasKeys.map(k=>k+'_lpm'),'quality'];const row=[h.id,h.start,h.experimentType||'reduction',h.inert||'n2',h.temp,h.mass,...gasKeys.map(k=>base[k].toFixed(2)),h.snapshot?'demo_archive_snapshot':'demo_legacy_snapshot'];const content='\ufeff'+[header,row].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=h.id+'-demo-snapshot.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出演示快照 CSV，包含全部 7 种气体字段。');}

        case 'logout': closeModal();state.loggedIn=false;state.mobileOpen=false;render(true);break;
        case 'login': state.userName=$('#login-name').value.trim()||'演示用户';state.userRole=$('#login-role').value;state.loggedIn=true;state.page='overview';historyReplace('overview');render(true);toast(`已以${state.userRole}身份进入演示界面。`);break;
        case 'new-recipe': state.draft={experimentType:'reduction',inert:'n2',purgeFlow:4,purgeSeconds:600,id:'保存后分配',name:'新建科研配方',kind:'科研自定义',version:0,updated:'尚未保存',owner:'实验员 A',status:'草稿',steps:[]}; state.editingNew=true;state.viewingVersion=false; state.tabs.recipes='editor'; render(); break;
        case 'edit-recipe': { const r=state.recipes.find(x=>x.id===element.dataset.id); if(r){state.selectedRecipeId=r.id;state.draft=clone(r);state.editingNew=false;state.viewingVersion=false;state.tabs.recipes='editor';render();} break; }
        case 'view-version': {const r=state.recipes.find(x=>x.id===element.dataset.id),v=Number(element.dataset.version),snapshot=v===r?.version?r:state.recipeSnapshots.find(x=>x.id===r?.id&&x.version===v);if(snapshot){state.selectedRecipeId=snapshot.id;state.draft=clone(snapshot);state.editingNew=false;state.viewingVersion=true;state.tabs.recipes='editor';render();}break;}
        case 'copy-recipe': {const source=state.draft;state.draft={experimentType:source.experimentType,inert:source.inert,purgeFlow:source.purgeFlow,purgeSeconds:source.purgeSeconds,id:'保存后分配',name:`${source.name} · 科研自定义`,kind:'科研自定义',version:0,updated:'尚未保存',owner:'实验员 A',status:'草稿',steps:source.kind==='标准候选'?[]:clone(source.steps)};state.editingNew=true;state.viewingVersion=false;render();toast('已建立自定义副本。请复核所有阶段参数和现场安全条件。');break;}
        case 'add-step': state.draft.steps.push({...gasValues({[state.draft.inert]:4}),name:`阶段 ${state.draft.steps.length+1}`,temp:900,ramp:10,hold:600}); render(); break;
        case 'remove-step': state.draft.steps.splice(Number(element.dataset.index),1); render(); break;
        case 'validate-recipe': { const problem=validateDraft(); toast(problem||'示例范围校验通过；现场量程和安全条件仍需真机核对。'); break; }
        case 'save-recipe': saveRecipe(); break;
        case 'pf-prev': state.preflight.step=Math.max(0,state.preflight.step-1); render(); break;
        case 'pf-next': if(state.preflight.step===0&&!validSample()) {toast(history.some(h=>h.id===state.preflight.sampleId)?'实验编号已存在，请使用新的唯一编号。':'请填写实验编号、样品、实验员和有效装样质量。');break;} state.preflight.step=Math.min(2,state.preflight.step+1); render(); break;
        case 'start-run': if(!startReady()) {toast('请先完成预检并确认设备状态、报警和当前实验。');break;} modal('确认启动实验',`将使用 <strong>${esc(chosenRecipe().id)} v${chosenRecipe().version}</strong> 和样品 <strong>${esc(state.preflight.sampleName)}</strong> 创建本次实验。命令受理、回读验证与实验运行状态将分别记录。`,'确认演示启动',()=>{if(!startReady()){toast('启动条件或使用上限已变化，请重新复核。');return false;} const p=state.preflight,r=chosenRecipe();state.run={id:p.sampleId,sample:p.sampleName,recipe:r.id,recipeVersion:r.version,status:'running',phase:r.steps[0]?.name||'惰性准备',stepIndex:0,elapsed:'00:00:01',started:'2026-10-27 09:52:00',sampleMass:Number(p.mass).toFixed(3)};bindRun(state.run,r);state.tabs.current='gas';state.events=[{time:'09:52:00',title:'实验启动请求已验证',detail:`${r.id} v${r.version} · ${p.operator}`,tone:'good',actor:state.userName}];state.page='current';historyReplace('current');render(true);toast('演示实验已启动；不会向真实设备发送命令。');}); break;
        case 'advance-step': {const r=state.run;if(!normalControl())break;const next=()=>{r.stepIndex=Math.min(r.stepIndex+1,r.snapshot.steps.length-1);r.phase=r.snapshot.steps[r.stepIndex].name;applyStage();if(r.stepIndex===r.snapshot.steps.length-1)safeSupply('配方进入末段');else addEvent('进入下一阶段',`${r.phase}；恢复该段配方：${gasSummary(r.flows)}`);render();};if(r.controlMode==='manual')modal('进入下一阶段',`当前存在手动覆盖。下一阶段将使用启动时配方快照：<strong>${esc(r.snapshot.steps[r.stepIndex+1]?.name||'收尾')}</strong>，手动设定随当前段结束。`,'确认进入下一段',next);else next();break;}
        case 'pause-run': if(!normalControl())break;modal('暂停并保持惰性气氛','关闭全部工艺气体，使用已选惰性气体保持。恢复前需重新确认当前阶段配方。','确认暂停',()=>{const r=state.run;r.pausedPhase=r.phase;r.flows=gasValues({[r.inert]:r.snapshot.purgeFlow});r.manualDraft=clone(r.flows);r.controlMode='safety';r.status='paused';r.phase='暂停 · 惰性保持';addEvent('实验暂停',gasSummary(r.flows));render();});break;
        case 'resume-run': if(!state.run||state.run.status!=='paused'||isStale()||hasAlarm()||state.run.emergency)break;modal('复核并恢复当前阶段',`恢复当前阶段配方：${esc(gasSummary(state.run.snapshot.steps[state.run.stepIndex]))} L/min。请确认现场恢复条件。`,'确认恢复',()=>{if(!canOperateExperiment()||isStale()||hasAlarm()||state.run.emergency||recipeProblem(state.run.snapshot)){toast('恢复条件或使用上限未满足。');return false;}state.run.status='running';state.run.phase=state.run.pausedPhase;applyStage();addEvent('实验恢复','复核后恢复当前阶段配方');render();});break;
        case 'stop-run': if(!state.run||!['running','paused'].includes(state.run.status))break;modal('停止实验并惰性收尾',`关闭全部工艺气体，使用 ${gasMeta[state.run.inert].label} ${state.run.snapshot.purgeFlow} L/min 吹扫与冷却。本次实验不可恢复。`,'确认停止',()=>{safeSupply('操作员停止实验');render();});break;
        case 'finish-cooling': if(!state.run||state.run.status!=='cooling'||isStale()||hasAlarm())break;modal('复核安全收尾',`<div class="stack"><div class="callout">演示中手动确认完成条件；真实设备应依据计时、冷却和实际反馈放行。</div><label class="check-row"><input id="safe-flow" type="checkbox">已核实工艺气体关闭、惰性气体流量正常</label><label class="check-row"><input id="safe-time" type="checkbox">惰性吹扫已达到 ${state.run.snapshot.purgeSeconds} s，冷却达到现场允许条件</label></div>`,'确认演示安全完成',()=>{if(!$('#safe-flow').checked||!$('#safe-time').checked){toast('未完成两项安全复核；保持惰性吹扫。');return false;}state.run.status='completed';state.run.phase='安全完成';state.run.flows=gasValues({});state.run.manualDraft=clone(state.run.flows);addEvent('安全处置完成','现场条件复核演示；供气关闭，允许归档');render();});break;
        case 'archive-run': modal('复核并归档实验','归档前检查原始采样完整性、报警与操作记录、配方快照以及安全完成依据。','确认归档演示',()=>{const r=state.run;history.unshift({id:r.id,sample:r.sample,recipe:`${r.recipe} · v${r.recipeVersion}`,status:'已归档',start:r.started,duration:r.elapsed,quality:'演示数据',temp:'897.6',mass:(Number(r.sampleMass)*53.142/54.28).toFixed(3),sampleMass:r.sampleMass,alarms:state.alarms.length,events:clone(state.events),limitPolicy:clone(r.limitPolicy),experimentType:r.experimentType,inert:r.inert,snapshot:clone(r.snapshot),emergency:r.emergency});state.selectedHistoryId=r.id;state.run=null;state.preflight=initialPreflight();state.preflight.sampleId=`RKA-2026-1027-${String(19+history.filter(h=>h.start.startsWith('2026-10-27')).length).padStart(3,'0')}`;state.page='history';historyReplace('history');render(true);toast('演示实验已归档，可查看详情与导出 CSV。');});break;
        case 'tare': modal('确认天平去皮','只有设备空载或满足现场去皮条件、且实验处于允许状态时才可执行。','确认演示去皮',()=>{addEvent('天平去皮请求已验证','操作员确认；示例回读成功');render();});break;
        case 'ack-alarm': {const a=state.alarms.find(x=>x.id===element.dataset.id);if(!a)break;modal('确认报警',`确认已阅读 <strong>${esc(a.message)}</strong>。该动作不会解除故障或恢复设备运行。`,'记录确认',()=>{a.ack=true;addEvent('报警已确认',`${a.id} · 实验员 A`);render();toast('已记录确认；仍需现场排除报警条件。');});break;}
        case 'apply-history': state.historyApplied=state.historySearch.trim();state.historyStatusApplied=state.historyStatus;render();break;
        case 'clear-history': state.historySearch='';state.historyStatus='all';state.historyApplied='';state.historyStatusApplied='all';render();break;
        case 'export-csv': exportCsv();break;
        case 'preview-report': state.selectedHistoryId=element.dataset.id;state.tabs.reports='preview';render();break;
        case 'audit-detail': {const e=state.events[Number(element.dataset.index)];if(e)modal('操作审计详情',`<div class="stack"><div class="op-status"><strong>${esc(e.title)}</strong><span>2026-10-27 ${esc(e.time)} · ${esc(e.actor||'实验员 A')}</span></div><div class="op-status"><strong>事件内容</strong><span>${esc(e.detail)}</span></div><div class="callout warn">演示事件没有真实设备回读或签名证据。</div></div>`,'关闭',()=>{});break;}
        case 'channel-detail': {const ch=mfcChannels.find(row=>row[0]===element.dataset.address);if(ch)modal(`MFC 地址 ${ch[0]}`,`<div class="stack"><div class="op-status"><strong>软件默认配置</strong><span>介质 ${esc(ch[1])} · 满量程 ${esc(ch[2])} L/min · COM4</span></div><div class="op-status"><strong>现场核查项</strong><span>设备铭牌、实际气体、通信地址、标定量程、管路和回读。</span></div><div class="callout warn">设备能力与使用上限分别记录；连接真机前仍需核对控制器地址、介质标定和实物映射。</div></div>`,'关闭',()=>{});break;}
        case 'refresh-device': toast(isConnected()?'演示快照已刷新；三类设备状态已更新。':'设备离线：请检查电源、线缆和串口配置。');render();break;
        case 'simulate-offline': setScenario('offline');break;
        case 'simulate-normal': setScenario('normal');break;
        case 'save-settings': toast('原型界面设置已保存到本次页面会话。');render();break;
        default: break;
      }
    }
    document.addEventListener('click',event=>{
      const page=event.target.closest('[data-page]');if(page){navigate(page.dataset.page);return;}
      const tab=event.target.closest('[data-tabgroup]');if(tab){state.tabs[tab.dataset.tabgroup]=tab.dataset.tab;render();return;}
      const action=event.target.closest('[data-action]');if(action){doAction(action.dataset.action,action);return;}
      const recipe=event.target.closest('[data-select-recipe]');if(recipe){const r=state.recipes.find(x=>x.id===recipe.dataset.selectRecipe);if(r){state.selectedRecipeId=r.id;state.draft=clone(r);state.editingNew=false;state.tabs.recipes='editor';render();}return;}
      const row=event.target.closest('[data-history-id]');if(row){state.selectedHistoryId=row.dataset.historyId;state.tabs.history='summary';render();return;}
      const pf=event.target.closest('[data-pf-step]');if(pf){const step=Number(pf.dataset.pfStep);if(step>0&&!validSample()){toast('请先填写完整样品信息。');return;}state.preflight.step=step;render();return;}
      const range=event.target.closest('[data-range]');if(range){state.chartRange=range.dataset.range;render();return;}
    });
    document.addEventListener('input',event=>{
      const el=event.target;
      if(el.dataset.gasLimit&&isAdmin()&&!limitLocked()){state.limitDraft[el.dataset.gasLimit]=el.value;const hint=$('#limit-validation');if(hint)hint.textContent=limitsProblem(state.limitDraft)||'输入有效；预览后确认应用。';}
      if(el.hasAttribute('data-limit-reason')&&isAdmin()&&!limitLocked())state.limitReason=el.value;
      if(el.dataset.manualGas&&normalControl()){const k=el.dataset.manualGas;state.run.manualDraft[k]=el.value;const bad=el.value===''||!Number.isFinite(Number(el.value))||Number(el.value)<0||Number(el.value)>gasLimit(k),message=bad?`请输入 0–${gasLimit(k)} L/min；当前设定未改变。`:'';el.setAttribute('aria-invalid',String(bad));const hint=$('#manual-error-'+k);if(hint)hint.textContent=message;}
      if(el.dataset.pfField) state.preflight[el.dataset.pfField]=el.value;
      if(el.dataset.recipeField&&el.dataset.recipeField!=='id') state.draft[el.dataset.recipeField]=el.type==='number'?Number(el.value):el.value;
      if(el.dataset.stepField) state.draft.steps[Number(el.dataset.stepIndex)][el.dataset.stepField]=el.value;
      if(el.id==='history-query') state.historySearch=el.value;
    });
    document.addEventListener('change',event=>{
      const el=event.target;
      if(el.hasAttribute('data-inert-select')){const r=state.draft,old=r.inert,next=el.value;if(state.viewingVersion||r.kind==='标准候选'||!canOperateExperiment())return;el.value=old;modal('切换共用通道介质',`将使用 ${gasMeta[next].label} 替代 ${gasMeta[old].label}；所有阶段的惰性流量迁移至新介质，原介质归零。启动前须核对实际气源和 MFC 介质标定。`,'确认切换',()=>{r.steps.forEach(s=>{s[next]=s[old];s[old]=0;});r.inert=next;render();});}
      else if(el.dataset.check){state.preflight.checks[el.dataset.check]=el.checked;render();}
      else if(el.dataset.pfField==='recipeId'){state.preflight.recipeId=el.value;state.preflight.checks.gas=false;state.preflight.checks.interlock=false;render();}
      else if(el.id==='history-status')state.historyStatus=el.value;
      else if(el.dataset.setting)state.settings[el.dataset.setting]=el.value;
      else if(el.dataset.settingCheck)state.settings[el.dataset.settingCheck]=el.checked;
      else if(el.dataset.analysisExp){state.selectedHistoryId=el.value;render();}
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&state.mobileOpen){state.mobileOpen=false;renderSidebar();}
      if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-select-recipe],[data-history-id]')){event.preventDefault();event.target.click();}
    });
    $('#mobile-backdrop').addEventListener('click',()=>{state.mobileOpen=false;renderSidebar();});
    $('#modal-cancel').addEventListener('click',closeModal);
    $('#modal-confirm').addEventListener('click',()=>{const callback=modalConfirm; if(callback&&callback()===false)return; closeModal();});
    $('#confirm-dialog').addEventListener('close',()=>{if(!$('#confirm-dialog').open)modalConfirm=null;});
    const initialHash=location.hash.replace('#','');if(pageNames[initialHash])state.page=initialHash;
    render();
  </script>
</body>
</html>
