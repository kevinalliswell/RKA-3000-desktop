<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RKA-3000 · 实验控制台 UI 原型</title>
  <style>
    :root {
      font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: #172c39;
      background: #edf1f2;
      --nav: #142a38;
      --nav-soft: #1c3949;
      --ink: #172c39;
      --ink-soft: #4e6471;
      --muted: #6e828d;
      --line: #d9e2e5;
      --line-strong: #bdcbd0;
      --canvas: #edf1f2;
      --surface: #ffffff;
      --surface-soft: #f6f8f8;
      --brand: #176c78;
      --brand-dark: #105a64;
      --brand-soft: #e1f0f0;
      --good: #19785c;
      --good-soft: #e5f4ec;
      --warn: #a75e1f;
      --warn-soft: #fff1df;
      --danger: #b43e39;
      --danger-soft: #fae8e6;
      --radius: 10px;
      --shadow: 0 10px 28px rgba(18, 44, 56, .06);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-width: 320px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .47; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid #7cc9d0; outline-offset: 2px;
    }
    a { color: var(--brand); }
    .icon { width: 18px; height: 18px; stroke-width: 1.8; flex: none; vertical-align: middle; }
    .icon.small { width: 15px; height: 15px; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 244px minmax(0, 1fr); }
    .sidebar { background: var(--nav); color: #deeaed; min-height: 100vh; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; z-index: 30; }
    .brand { height: 78px; display: flex; gap: 12px; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .brand-mark { width: 38px; height: 38px; border: 1.5px solid #81cbd0; color: #a9e1e3; display: grid; place-items: center; border-radius: 9px; font-weight: 800; font-size: 18px; letter-spacing: -.08em; }
    .brand-title { font-size: 16px; font-weight: 750; letter-spacing: .02em; color: #fff; }
    .brand-sub { color: #a9bcc4; font-size: 11px; margin-top: 3px; letter-spacing: .06em; }
    .nav-scroll { overflow-y: auto; padding: 15px 11px 20px; flex: 1; }
    .nav-group { margin-bottom: 14px; }
    .nav-label { color: #809ca8; font-size: 10px; letter-spacing: .15em; font-weight: 700; padding: 11px 13px 7px; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent; color: #c4d4da; padding: 10px 13px; border-radius: 7px; text-align: left; font-size: 13px; font-weight: 600; transition: background .17s, color .17s; }
    .nav-item:hover { background: #254554; color: #fff; }
    .nav-item.active { background: #27505d; color: #fff; box-shadow: inset 3px 0 #88d1d2; }
    .nav-item .count { margin-left: auto; background: #bb463f; color: #fff; border-radius: 20px; padding: 1px 6px; font-size: 10px; }
    .nav-foot { border-top: 1px solid rgba(255,255,255,.1); padding: 15px 20px 17px; font-size: 11px; color: #a6bcc4; line-height: 1.7; }
    .nav-foot strong { color: #dce8eb; font-weight: 650; }
    .workspace { min-width: 0; }
    .topbar { height: 68px; position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.98); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 15px; padding: 0 28px; }
    .menu-button { display: none !important; }
    .top-path { min-width: 0; margin-right: auto; }
    .top-path small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .11em; font-weight: 700; }
    .top-path strong { display: block; font-size: 15px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .top-action { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 8px 10px; border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; }
    .top-action:hover { border-color: #93b9bd; background: var(--surface-soft); }
    .proto-strip { background: #fff7e8; color: #765424; border-bottom: 1px solid #efdfbf; padding: 9px 28px; font-size: 11px; display: flex; align-items: center; gap: 8px; }
    .proto-strip strong { color: #664413; }
    .page { width: min(100%, 1540px); margin: 0 auto; padding: 25px 28px 48px; animation: rise .22s ease-out; }
    @keyframes rise { from { opacity: .65; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 21px; }
    .eyebrow { margin: 0 0 6px; color: var(--brand); font-size: 10px; letter-spacing: .13em; font-weight: 800; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(22px, 2vw, 28px); line-height: 1.3; letter-spacing: -.02em; margin-bottom: 5px; }
    h2 { font-size: 15px; line-height: 1.4; margin-bottom: 0; }
    h3 { font-size: 13px; line-height: 1.4; margin-bottom: 0; }
    .lead { color: var(--ink-soft); font-size: 12px; line-height: 1.6; margin: 0; }
    .subtle { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .small { font-size: 11px; }
    .mono, .metric-value, .data-table td.numeric, .clock { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .row.space { justify-content: space-between; }
    .stack { display: grid; gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .grid-main { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(290px, .85fr); gap: 16px; align-items: start; }
    .grid-side { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(330px, .85fr); gap: 16px; align-items: start; }
    .panel { min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-header { padding: 17px 19px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-header p { margin: 3px 0 0; }
    .panel-body { padding: 18px 19px; }
    .panel-body.compact { padding: 0; }
    .panel-footer { border-top: 1px solid var(--line); padding: 13px 19px; background: #fbfcfc; }
    .hero-panel { background: #16313f; color: white; border: 1px solid #16313f; border-radius: var(--radius); overflow: hidden; display: grid; grid-template-columns: minmax(0,1fr) 290px; box-shadow: var(--shadow); }
    .hero-main { padding: 22px 24px; }
    .hero-main .eyebrow { color: #9bd6d7; }
    .hero-main h2 { font-size: 22px; margin: 7px 0; color: #fff; }
    .hero-main p { color: #bbd0d6; font-size: 12px; line-height: 1.7; margin-bottom: 15px; }
    .hero-side { background: #204453; padding: 19px 22px; display: grid; align-content: center; gap: 9px; }
    .hero-side span { font-size: 11px; color: #a9c6ce; }
    .hero-side strong { display: block; color: #fff; font-size: 13px; line-height: 1.5; }
    .hero-side .clock { font-size: 21px; }
    .hero-panel .button.secondary { color: #eaf8f8; border-color: #648d97; background: transparent; }
    .hero-panel .button.secondary:hover { background: #2b5967; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .metric { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
    .metric-label { display: flex; gap: 6px; align-items: center; color: var(--ink-soft); font-size: 11px; font-weight: 650; margin-bottom: 9px; }
    .metric-value { font-weight: 700; font-size: 24px; letter-spacing: -.04em; white-space: nowrap; }
    .metric-value em { font-family: inherit; font-style: normal; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
    .metric-meta { color: var(--muted); font-size: 10px; margin-top: 4px; }
    .badge { display: inline-flex; gap: 5px; align-items: center; vertical-align: middle; padding: 4px 8px; border-radius: 5px; background: #e8eef1; color: #405c69; font-size: 10px; font-weight: 750; white-space: nowrap; }
    .badge.good { background: var(--good-soft); color: var(--good); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.danger { background: var(--danger-soft); color: var(--danger); }
    .badge.info { background: var(--brand-soft); color: var(--brand-dark); }
    .badge.dark { background: #294754; color: #e2f1f2; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .button { border: 1px solid transparent; border-radius: 7px; min-height: 34px; padding: 7px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-align: center; font-size: 11px; font-weight: 750; line-height: 1.3; text-decoration: none; white-space: nowrap; transition: background .16s, border-color .16s, transform .16s; }
    .button:hover:not(:disabled) { transform: translateY(-1px); }
    .button.primary { color: #fff; background: var(--brand); border-color: var(--brand); }
    .button.primary:hover:not(:disabled) { background: var(--brand-dark); }
    .button.secondary { color: var(--ink); background: #fff; border-color: var(--line-strong); }
    .button.secondary:hover:not(:disabled) { background: #f3f7f7; border-color: #8eb1b6; }
    .button.danger { color: #fff; background: var(--danger); border-color: var(--danger); }
    .button.danger:hover:not(:disabled) { background: #9d302c; }
    .button.ghost { color: var(--brand); background: transparent; border-color: transparent; }
    .button.ghost:hover:not(:disabled) { background: var(--brand-soft); }
    .button.full { width: 100%; }
    .button.icon-only { width: 34px; padding: 7px; }
    .segmented { display: inline-flex; border: 1px solid var(--line-strong); background: #fff; border-radius: 7px; padding: 2px; gap: 2px; }
    .segmented button { border: 0; background: transparent; color: var(--ink-soft); border-radius: 5px; padding: 5px 10px; font-size: 11px; font-weight: 700; }
    .segmented button[aria-pressed="true"] { background: #dceced; color: var(--brand-dark); }
    .tabs { display: flex; gap: 3px; border-bottom: 1px solid var(--line); padding: 0 18px; overflow-x: auto; }
    .tabs button { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--ink-soft); padding: 13px 14px 11px; white-space: nowrap; font-size: 11px; font-weight: 700; }
    .tabs button:hover { color: var(--brand); }
    .tabs button[aria-selected="true"] { border-bottom-color: var(--brand); color: var(--brand); }
    .callout { border: 1px solid #bddfe1; background: #edf8f7; color: #245d64; border-radius: 8px; padding: 12px 14px; font-size: 11px; line-height: 1.65; }
    .callout.warn { background: var(--warn-soft); border-color: #f0d5af; color: #805222; }
    .callout.danger { background: var(--danger-soft); border-color: #e9b9b5; color: #883c38; }
    .callout strong { color: inherit; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field label { color: var(--ink-soft); font-size: 11px; font-weight: 700; }
    .field input, .field select, .field textarea, .input { min-height: 35px; width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; background: white; color: var(--ink); padding: 7px 10px; outline: none; font-size: 12px; }
    .field textarea { min-height: 70px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus, .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #e1f0f0; }
    .field input:disabled, .field select:disabled { background: #eff2f3; color: var(--muted); }
    .field .hint { color: var(--muted); font-size: 10px; line-height: 1.45; }
    .field.span-2 { grid-column: span 2; }
    .check-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #ecf0f1; font-size: 11px; line-height: 1.55; }
    .check-row:last-child { border-bottom: 0; }
    .check-row input { accent-color: var(--brand); margin: 2px 0 0; width: 15px; height: 15px; flex: none; }
    .check-row strong { display: block; font-size: 11px; }
    .check-row span { display: block; color: var(--muted); font-size: 10px; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
    .data-table th { background: #f5f8f8; color: #55707a; text-align: left; font-size: 10px; letter-spacing: .03em; font-weight: 750; border-bottom: 1px solid var(--line); padding: 10px 12px; }
    .data-table td { padding: 11px 12px; border-bottom: 1px solid #edf0f1; color: var(--ink); }
    .data-table tbody tr:last-child td { border-bottom: 0; }
    .data-table tbody tr:hover { background: #f7faf9; }
    .data-table tr.selected { background: #eaf5f4; }
    .data-table .muted-cell { color: var(--muted); }
    .data-table .click-row { cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid #e9eff0; }
    .list-row:last-child { border: 0; }
    .list-row strong { display: block; font-size: 11px; }
    .list-row span { display: block; font-size: 10px; color: var(--muted); margin-top: 4px; }
    .readout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .readout-item { background: #f7f9f9; border: 1px solid #e8eeef; border-radius: 7px; padding: 10px; }
    .readout-item small { display: block; color: var(--muted); font-size: 10px; margin-bottom: 6px; }
    .readout-item strong { font: 700 15px "Cascadia Code", Consolas, monospace; }
    .readout-item em { font-style: normal; color: var(--muted); font-size: 10px; }
    .progress-track { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 5px; }
    .progress-node { min-width: 0; padding: 9px 8px; background: #edf1f2; color: var(--muted); border-radius: 5px; text-align: center; font-size: 10px; font-weight: 700; }
    .progress-node.done { background: #ddefe9; color: #216b58; }
    .progress-node.now { background: #dceff0; color: #135e68; outline: 1px solid #7bbfc5; }
    .timeline { margin: 0; padding: 0; list-style: none; }
    .timeline li { position: relative; padding: 0 0 16px 22px; border-left: 1px solid #cfdbde; margin-left: 5px; }
    .timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
    .timeline li::before { content: ""; position: absolute; left: -5px; top: 1px; width: 9px; height: 9px; background: #6cabb0; border: 2px solid #fff; border-radius: 50%; }
    .timeline strong { display: block; font-size: 11px; font-weight: 700; }
    .timeline small { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .chart-box { width: 100%; min-height: 235px; background: #fbfcfc; }
    .chart-box svg { width: 100%; height: auto; display: block; }
    .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-soft); font-size: 10px; }
    .chart-legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; vertical-align: 3px; margin-right: 6px; background: var(--legend); border-radius: 2px; }
    .quick-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick-link { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 7px; padding: 10px 12px; display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; }
    .quick-link:hover { background: #f4f8f8; border-color: #9fc4c8; }
    .empty { text-align: center; display: grid; justify-items: center; gap: 9px; padding: 38px 24px; color: var(--muted); }
    .empty .icon { width: 31px; height: 31px; color: #7aa8ae; }
    .empty h3 { color: var(--ink); font-size: 14px; }
    .empty p { font-size: 11px; max-width: 390px; line-height: 1.6; margin: 0; }
    .step-nav { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; }
    .step-nav button { border: 1px solid var(--line); background: #fff; color: var(--ink-soft); padding: 10px 12px; min-width: 115px; text-align: left; border-radius: 7px; font-size: 11px; font-weight: 700; }
    .step-nav button.current { border-color: #8fbfc3; color: var(--brand-dark); background: #e8f3f3; }
    .step-nav button.done { border-color: #c3e5d3; color: var(--good); background: #eef8f2; }
    .step-nav small { display: block; font-size: 9px; font-weight: 700; opacity: .7; margin-bottom: 3px; }
    .operation-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .op-status { padding: 11px 12px; border: 1px solid var(--line); background: #f7f9f9; border-radius: 7px; font-size: 11px; }
    .op-status strong { display: block; margin-bottom: 4px; }
    .op-status span { color: var(--muted); }
    .notice-line { display: flex; align-items: flex-start; gap: 8px; color: var(--ink-soft); font-size: 10px; line-height: 1.6; }
    .notice-line .icon { margin-top: 1px; }
    .shell.logged-out { display: block; }
    .shell.logged-out .sidebar, .shell.logged-out .topbar { display: none; }
    .login-wrap { min-height: calc(100vh - 35px); display: grid; place-items: center; padding: 30px 16px; background: radial-gradient(circle at 80% 10%, #dbeceb, transparent 35%), #edf1f2; }
    .login-card { width: min(100%, 440px); background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 30px; box-shadow: 0 20px 65px #17354118; }
    .login-card .brand-mark { background: var(--nav); margin-bottom: 18px; }
    .login-card h1 { margin-bottom: 7px; }
    .login-card .stack { margin-top: 22px; }
    dialog { border: 0; border-radius: 11px; padding: 0; max-width: min(92vw, 480px); width: 100%; box-shadow: 0 22px 70px rgba(9,27,38,.28); color: var(--ink); }
    dialog::backdrop { background: rgba(8,25,34,.58); }
    .modal-head { padding: 19px 21px 14px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { font-size: 17px; }
    .modal-body { padding: 18px 21px; font-size: 12px; color: var(--ink-soft); line-height: 1.75; }
    .modal-actions { padding: 13px 21px 18px; display: flex; justify-content: flex-end; gap: 8px; }
    #toast { position: fixed; z-index: 100; right: 22px; bottom: 20px; max-width: min(420px, calc(100vw - 40px)); background: #173541; color: #fff; box-shadow: 0 14px 34px #1735413c; border-radius: 8px; padding: 12px 15px; font-size: 12px; line-height: 1.5; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .18s, transform .18s; }
    #toast.show { opacity: 1; transform: none; }
    .mobile-backdrop { display: none; }
    @media (max-width: 1200px) { .metric-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .grid-main, .grid-side { grid-template-columns: minmax(0,1fr) 300px; } }
    @media (max-width: 950px) { .shell { grid-template-columns: 70px minmax(0,1fr); } .sidebar { width: 70px; } .brand { padding: 0 15px; } .brand-copy, .nav-label, .nav-item span, .nav-foot { display: none; } .nav-scroll { padding: 15px 9px; } .nav-item { justify-content: center; padding: 11px; } .nav-item .count { display: none; } .grid-main, .grid-side { grid-template-columns: minmax(0,1fr); } }
    @media (max-width: 680px) { .shell { display: block; } .sidebar { position: fixed; left: 0; top: 0; width: 244px; transform: translateX(-105%); transition: transform .2s; } .sidebar.open { transform: none; } .sidebar .brand-copy, .sidebar .nav-label, .sidebar .nav-item span, .sidebar .nav-foot { display: block; } .sidebar .nav-item { justify-content: flex-start; } .mobile-backdrop.open { display: block; position: fixed; inset: 0; background: #122b3880; z-index: 25; } .menu-button { display: inline-flex !important; } .topbar { padding: 0 14px; height: 60px; } .top-status .badge:not(.mode-badge) { display: none; } .top-action span { display: none; } .proto-strip { padding: 8px 14px; } .page { padding: 18px 14px 36px; } .hero-panel { grid-template-columns: 1fr; } .hero-side { grid-template-columns: 1fr 1fr; } .page-head { flex-wrap: wrap; } .grid-2, .grid-3 { grid-template-columns: 1fr; } .form-grid { grid-template-columns: 1fr; } .field.span-2 { grid-column: auto; } }
    @media (max-width: 430px) { .metric-grid { grid-template-columns: 1fr 1fr; gap: 8px; } .metric { padding: 11px; } .metric-value { font-size: 19px; } .readout { grid-template-columns: repeat(2,minmax(0,1fr)); } .hero-side { grid-template-columns: 1fr; } .top-path small { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="mobile-backdrop" id="mobile-backdrop" aria-hidden="true"></div>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航"></aside>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <div class="proto-strip"><strong>交互原型</strong><span>所有数值均为演示数据，操作只改变页面状态，不连接真实设备。</span></div>
      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="confirm-dialog" aria-labelledby="modal-title">

    function preflightSample() { const p=state.preflight; return `<fieldset ${canOperateExperiment()?'':'disabled'} style="border:0;padding:0;margin:0;min-width:0"><div class="form-grid"><div class="field"><label for="pf-recipe">实验配方</label><select id="pf-recipe" data-pf-field="recipeId">${state.recipes.map(r=>`<option value="${r.id}" ${r.id===p.recipeId?'selected':''}>${r.id} · ${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label for="pf-mode">实验模式</label><input id="pf-mode" value="${esc(chosenRecipe().kind)}" disabled></div><div class="field"><label for="pf-id">实验编号 *</label><input id="pf-id" data-pf-field="sampleId" value="${esc(p.sampleId)}"></div><div class="field"><label for="pf-sample">样品名称 *</label><input id="pf-sample" data-pf-field="sampleName" value="${esc(p.sampleName)}"></div><div class="field"><label for="pf-mass">初始装样质量 g *</label><input id="pf-mass" data-pf-field="mass" type="number" step="0.001" min="0.001" max="300" value="${esc(p.mass)}"></div><div class="field"><label for="pf-operator">实验员 *</label><input id="pf-operator" data-pf-field="operator" value="${esc(p.operator)}"></div><div class="field"><label for="pf-tfe">全铁 TFe %</label><input id="pf-tfe" data-pf-field="tfe" type="number" step="0.01" min="0" max="100" value="${esc(p.tfe)}"><span class="hint">用于后续方法验证的分析依据，首期不自动判定。</span></div><div class="field"><label for="pf-feo">FeO %</label><input id="pf-feo" data-pf-field="feo" type="number" step="0.01" min="0" max="100" value="${esc(p.feo)}"></div><div class="field span-2"><label for="pf-notes">样品与现场备注</label><textarea id="pf-notes" data-pf-field="notes" placeholder="样品批次、准备方式、偏离说明">${esc(p.notes)}</textarea></div></div></fieldset>`; }

    function renderPreflight() { const p=state.preflight; const stepTitles=['样品与配方','设备与现场','复核与启动']; const content=[preflightSample,preflightDevice,preflightConfirm][p.step](); return `${pageHead('实验工作流 / PREPARE','实验准备','从样品身份、配方版本到设备和现场条件逐项确认。')}

    function validateDraft() {
      const r=state.draft;
      if(!r.name.trim()) return '请填写配方名称。';
      if(!r.steps.length) return '请至少添加一个工艺阶段。';
      for(let i=0;i<r.steps.length;i++) {
        const s=r.steps[i], n=i+1;
        if(!s.name.trim()) return `第 ${n} 阶段缺少名称。`;
        for(const key of ['temp','ramp','hold','n2','h2','co']) if(!Number.isFinite(Number(s[key]))) return `第 ${n} 阶段存在无效数值。`;
        if(Number(s.temp)<0||Number(s.temp)>1600) return `第 ${n} 阶段目标温度需在 0–1600 ℃。`;
        if(Number(s.ramp)<0||Number(s.ramp)>20) return `第 ${n} 阶段升温速率需在 0–20 ℃/min。`;
        if(Number(s.hold)<0||Number(s.n2)<0||Number(s.n2)>20||Number(s.h2)<0||Number(s.h2)>5||Number(s.co)<0||Number(s.co)>5) return `第 ${n} 阶段保温时间或气体流量超出示例范围。`;
      }
      return '';
    }

        case 'login': state.userName=$('#login-name').value.trim()||'演示用户';state.userRole=$('#login-role').value;state.loggedIn=true;state.page='overview';historyReplace('overview');render(true);toast(`已以${state.userRole}身份进入演示界面。`);break;
        case 'new-recipe': state.draft={id:'保存后分配',name:'新建科研配方',kind:'科研自定义',version:0,updated:'尚未保存',owner:'实验员 A',status:'草稿',steps:[]}; state.editingNew=true;state.viewingVersion=false; state.tabs.recipes='editor'; render(); break;
        case 'edit-recipe': { const r=state.recipes.find(x=>x.id===element.dataset.id); if(r){state.selectedRecipeId=r.id;state.draft=clone(r);state.editingNew=false;state.viewingVersion=false;state.tabs.recipes='editor';render();} break; }
        case 'view-version': {const r=state.recipes.find(x=>x.id===element.dataset.id),v=Number(element.dataset.version),snapshot=v===r?.version?r:state.recipeSnapshots.find(x=>x.id===r?.id&&x.version===v);if(snapshot){state.selectedRecipeId=snapshot.id;state.draft=clone(snapshot);state.editingNew=false;state.viewingVersion=true;state.tabs.recipes='editor';render();}break;}
        case 'copy-recipe': {const source=state.draft;state.draft={id:'保存后分配',name:`${source.name} · 科研自定义`,kind:'科研自定义',version:0,updated:'尚未保存',owner:'实验员 A',status:'草稿',steps:source.kind==='标准候选'?[]:clone(source.steps)};state.editingNew=true;state.viewingVersion=false;render();toast('已建立自定义副本。请复核所有阶段参数和现场安全条件。');break;}
        case 'add-step': state.draft.steps.push({name:`阶段 ${state.draft.steps.length+1}`,temp:900,ramp:10,hold:600,n2:4,h2:0,co:0}); render(); break;
        case 'remove-step': state.draft.steps.splice(Number(element.dataset.index),1); render(); break;
        case 'validate-recipe': { const problem=validateDraft(); toast(problem||'示例范围校验通过；现场量程和安全条件仍需真机核对。'); break; }
        case 'save-recipe': saveRecipe(); break;
        case 'pf-prev': state.preflight.step=Math.max(0,state.preflight.step-1); render(); break;
        case 'pf-next': if(state.preflight.step===0&&!validSample()) {toast(history.some(h=>h.id===state.preflight.sampleId)?'实验编号已存在，请使用新的唯一编号。':'请填写实验编号、样品、实验员和有效装样质量。');break;} state.preflight.step=Math.min(2,state.preflight.step+1); render(); break;
        case 'start-run': if(!startReady()) {toast('请先完成预检并确认设备状态、报警和当前实验。');break;} modal('确认启动实验',`将使用 <strong>${esc(chosenRecipe().id)} v${chosenRecipe().version}</strong> 和样品 <strong>${esc(state.preflight.sampleName)}</strong> 创建本次实验。命令受理、回读验证与实验运行状态将分别记录。`,'确认演示启动',()=>{ const p=state.preflight,r=chosenRecipe();state.run={id:p.sampleId,sample:p.sampleName,recipe:r.id,recipeVersion:r.version,status:'running',phase:r.steps[0]?.name||'惰性准备',stepIndex:0,elapsed:'00:00:01',started:'2026-10-27 09:52:00',sampleMass:Number(p.mass).toFixed(3)};state.events=[{time:'09:52:00',title:'实验启动请求已验证',detail:`${r.id} v${r.version} · ${p.operator}`,tone:'good',actor:state.userName}];state.page='current';historyReplace('current');render(true);toast('演示实验已启动；不会向真实设备发送命令。');}); break;
        case 'advance-step': { const r=state.recipes.find(x=>x.id===state.run.recipe);if(!r)break;state.run.stepIndex=Math.min(state.run.stepIndex+1,r.steps.length-1);state.run.phase=r.steps[state.run.stepIndex]?.name||'安全处置';if(state.run.stepIndex===r.steps.length-1){state.run.status='cooling';addEvent('测定结束，进入安全处置','继续记录惰性气体与冷却阶段');}else addEvent(`进入第 ${state.run.stepIndex+1} 阶段`,state.run.phase);render();break; }
        case 'pause-run': modal('确认暂停实验','暂停后进入经批准的安全保持策略；配方计时与设备动作由后台统一协调。','确认暂停',()=>{state.run.pausedPhase=state.run.phase;state.run.status='paused';state.run.phase='安全保持';addEvent('实验已暂停','操作员确认；等待恢复条件复核');render();}); break;
        case 'resume-run': if(!isConnected()||isStale()||hasAlarm()){toast('设备状态或报警未满足恢复条件。');break;}modal('确认恢复实验','请复核设备读数、现场安全条件和当前步骤后恢复；故障结束后不得自动从中间步骤重启。','确认恢复',()=>{state.run.status='running';state.run.phase=state.run.pausedPhase||'当前工艺阶段';addEvent('实验已恢复','操作员确认，恢复当前步骤');render();});break;
        case 'stop-run': modal('确认停止实验','停止请求会结束测定，但惰性气体处置和冷却仍需继续记录。请先按现场 SOP 确认安全路径。','确认停止',()=>{state.run.status='cooling';state.run.stepIndex=3;state.run.phase='惰性处置与冷却';addEvent('停止请求已受理','测定结束；继续记录安全处置与冷却');render();},true);break;
        case 'finish-cooling': modal('模拟安全处置完成','本操作仅演示“测定结束”与“安全完成”分开留证。真实完成状态必须来自独立验证的设备反馈与现场复核。','确认演示完成',()=>{state.run.status='completed';state.run.phase='安全完成';addEvent('安全处置完成','冷却与现场确认记录已演示');render();});break;
        case 'archive-run': modal('复核并归档实验','归档前检查原始采样完整性、报警与操作记录、配方快照以及安全完成依据。','确认归档演示',()=>{const r=state.run;history.unshift({id:r.id,sample:r.sample,recipe:`${r.recipe} · v${r.recipeVersion}`,status:'已归档',start:r.started,duration:r.elapsed,quality:'演示数据',temp:'897.6',mass:(Number(r.sampleMass)*53.142/54.28).toFixed(3),sampleMass:r.sampleMass,alarms:state.alarms.length,events:clone(state.events)});state.selectedHistoryId=r.id;state.run=null;state.preflight=initialPreflight();state.preflight.sampleId=`RKA-2026-1027-${String(19+history.filter(h=>h.start.startsWith('2026-10-27')).length).padStart(3,'0')}`;state.page='history';historyReplace('history');render(true);toast('演示实验已归档，可查看详情与导出 CSV。');});break;
        case 'tare': modal('确认天平去皮','只有设备空载或满足现场去皮条件、且实验处于允许状态时才可执行。','确认演示去皮',()=>{addEvent('天平去皮请求已验证','操作员确认；示例回读成功');render();});break;
        case 'ack-alarm': {const a=state.alarms.find(x=>x.id===element.dataset.id);if(!a)break;modal('确认报警',`确认已阅读 <strong>${esc(a.message)}</strong>。该动作不会解除故障或恢复设备运行。`,'记录确认',()=>{a.ack=true;addEvent('报警已确认',`${a.id} · 实验员 A`);render();toast('已记录确认；仍需现场排除报警条件。');});break;}
        case 'apply-history': state.historyApplied=state.historySearch.trim();state.historyStatusApplied=state.historyStatus;render();break;
        case 'clear-history': state.historySearch='';state.historyStatus='all';state.historyApplied='';state.historyStatusApplied='all';render();break;
        case 'export-csv': exportCsv();break;
        case 'preview-report': state.selectedHistoryId=element.dataset.id;state.tabs.reports='preview';render();break;
        case 'audit-detail': {const e=state.events[Number(element.dataset.index)];if(e)modal('操作审计详情',`<div class="stack"><div class="op-status"><strong>${esc(e.title)}</strong><span>2026-10-27 ${esc(e.time)} · ${esc(e.actor||'实验员 A')}</span></div><div class="op-status"><strong>事件内容</strong><span>${esc(e.detail)}</span></div><div class="callout warn">演示事件没有真实设备回读或签名证据。</div></div>`,'关闭',()=>{});break;}
        case 'channel-detail': {const ch=mfcChannels.find(row=>row[0]===element.dataset.address);if(ch)modal(`MFC 地址 ${ch[0]}`,`<div class="stack"><div class="op-status"><strong>软件默认配置</strong><span>介质 ${esc(ch[1])} · 满量程 ${esc(ch[2])} L/min · COM4</span></div><div class="op-status"><strong>现场核查项</strong><span>设备铭牌、实际气体、通信地址、标定量程、管路和回读。</span></div><div class="callout warn">软件默认值与硬件清单并不一致。未经实物映射确认，不能据此发送流量设定。</div></div>`,'关闭',()=>{});break;}
        case 'refresh-device': toast(isConnected()?'演示快照已刷新；三类设备状态已更新。':'设备离线：请检查电源、线缆和串口配置。');render();break;
        case 'simulate-offline': setScenario('offline');break;
        case 'simulate-normal': setScenario('normal');break;
        case 'save-settings': toast('原型界面设置已保存到本次页面会话。');render();break;
        default: break;
      }
    }
    document.addEventListener('click',event=>{
      const page=event.target.closest('[data-page]');if(page){navigate(page.dataset.page);return;}
      const tab=event.target.closest('[data-tabgroup]');if(tab){state.tabs[tab.dataset.tabgroup]=tab.dataset.tab;render();return;}
      const action=event.target.closest('[data-action]');if(action){doAction(action.dataset.action,action);return;}
      const recipe=event.target.closest('[data-select-recipe]');if(recipe){const r=state.recipes.find(x=>x.id===recipe.dataset.selectRecipe);if(r){state.selectedRecipeId=r.id;state.draft=clone(r);state.editingNew=false;state.tabs.recipes='editor';render();}return;}
      const row=event.target.closest('[data-history-id]');if(row){state.selectedHistoryId=row.dataset.historyId;state.tabs.history='summary';render();return;}
      const pf=event.target.closest('[data-pf-step]');if(pf){const step=Number(pf.dataset.pfStep);if(step>0&&!validSample()){toast('请先填写完整样品信息。');return;}state.preflight.step=step;render();return;}
      const range=event.target.closest('[data-range]');if(range){state.chartRange=range.dataset.range;render();return;}
    });
    document.addEventListener('input',event=>{
      const el=event.target;
      if(el.dataset.pfField) state.preflight[el.dataset.pfField]=el.value;
      if(el.dataset.recipeField&&el.dataset.recipeField!=='id') state.draft[el.dataset.recipeField]=el.value;
      if(el.dataset.stepField) state.draft.steps[Number(el.dataset.stepIndex)][el.dataset.stepField]=el.value;
      if(el.id==='history-query') state.historySearch=el.value;
    });
    document.addEventListener('change',event=>{
      const el=event.target;
      if(el.dataset.check){state.preflight.checks[el.dataset.check]=el.checked;render();}
      else if(el.dataset.pfField==='recipeId'){state.preflight.recipeId=el.value;render();}
      else if(el.id==='history-status')state.historyStatus=el.value;
      else if(el.dataset.setting)state.settings[el.dataset.setting]=el.value;
      else if(el.dataset.settingCheck)state.settings[el.dataset.settingCheck]=el.checked;
      else if(el.dataset.analysisExp){state.selectedHistoryId=el.value;render();}
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&state.mobileOpen){state.mobileOpen=false;renderSidebar();}
      if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-select-recipe],[data-history-id]')){event.preventDefault();event.target.click();}
    });
    $('#mobile-backdrop').addEventListener('click',()=>{state.mobileOpen=false;renderSidebar();});
    $('#modal-cancel').addEventListener('click',closeModal);
    $('#modal-confirm').addEventListener('click',()=>{const callback=modalConfirm; if(callback) callback(); closeModal();});
    $('#confirm-dialog').addEventListener('close',()=>{modalConfirm=null;});
    const initialHash=location.hash.replace('#','');if(pageNames[initialHash])state.page=initialHash;
    render();
  </script>
</body>
</html>
