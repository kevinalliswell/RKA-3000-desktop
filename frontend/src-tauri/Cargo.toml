[package]
name = "rka-desktop-shell"
version = "0.7.0"
description = "RKA-3000 desktop shell"
authors = ["RKA Team"]
license = "MIT"
repository = "https://github.com/kevinalliswell/RKA-3000-desktop"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rka_desktop_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
