[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rka-desktop"
version = "0.1.0"
description = "RKA-3000 desktop app scaffold (PySide6 + SQLite3 + Modbus RTU)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RKA Team"}]
dependencies = [
  "PySide6>=6.8",
  "pymodbus>=3.7",
  "pyserial>=3.5",
  "pydantic-settings>=2.6",
  "pandas>=2.2",
  "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
