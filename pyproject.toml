[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "rka_desktop.__version__"}

[project]
name = "rka-desktop"
dynamic = ["version"]
description = "RKA-3000 iron-ore reduction kinetics system: Python business backend for the Tauri desktop"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RKA Team"}]
dependencies = [
  "pymodbus>=3.7",
  "pyserial>=3.5",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
rka3000 = "rka_desktop.adapters.cli.main:main"
rka3000-backend = "rka_desktop.adapters.api.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rka_desktop.infrastructure.comm._vendor" = ["VENDOR.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
exclude = ["src/rka_desktop/infrastructure/comm/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
