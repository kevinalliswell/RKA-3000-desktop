name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # PySide6 can segfault during Qt teardown at interpreter exit on headless CI
        # (after all tests pass). Derive the verdict from the JUnit report, not the
        # teardown-corrupted exit code.
        run: |
          pytest -q --junitxml=pytest-report.xml || true
          python scripts/checks/check_pytest_report.py pytest-report.xml

      - name: Compile sources
        run: python -m compileall src tests

      - name: Verify version sync
        run: python scripts/checks/verify_version_sync.py

