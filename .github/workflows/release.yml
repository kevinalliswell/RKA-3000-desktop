name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify tag matches pyproject version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/checks/verify_tag_version.py

      - name: Run tests
        # See ci.yml: tolerate the Qt teardown segfault, verdict from the JUnit report.
        run: |
          pytest -q --junitxml=pytest-report.xml || true
          python scripts/checks/check_pytest_report.py pytest-report.xml

      - name: Extract release notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/release.py notes "$VERSION" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Verify version sync
        run: python scripts/checks/verify_version_sync.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md

