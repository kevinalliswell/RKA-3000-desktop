name: tauri-windows-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rka-ui-comm-prep

jobs:
  build-tauri-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python and backend packager
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]" pyinstaller
      - name: Run backend tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m pytest -q --ignore=tests/test_ui_smoke.py
      - name: Build Tauri Windows installer
        shell: pwsh
        run: .\scripts\packaging\build_tauri_windows.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RKA-3000-tauri-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
